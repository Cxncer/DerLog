<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DerLog — Personal Travel Planner</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#040811" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DerLog" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.cdnfonts.com/css/neue-montreal" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Neue Montreal','Plus Jakarta Sans',-apple-system,sans-serif; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#040811; transition:background-color .3s ease; }
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    .slide-anim{animation:slideInRight .6s cubic-bezier(.16,1,.3,1) forwards}
    .theme-dark{background:#020408;color:#fff}
    .theme-dark .aurora-canvas{background-color:#040811;background-image:radial-gradient(circle at 88% 8%,rgba(27,84,255,.42) 0%,rgba(27,84,255,.08) 38%,transparent 65%),radial-gradient(circle at 12% 92%,rgba(131,249,255,.28) 0%,transparent 55%)}
    .theme-dark .glass-pill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px)}
    .theme-dark .glass-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(16px);color:#fff}
    .theme-dark .modal-bg{background:#080F1E;border-color:rgba(255,255,255,.15);color:#fff}
    .theme-dark .nav-container{background:rgba(14,23,42,.85);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px)}
    .theme-dark .input-bg{background:rgba(255,255,255,.06);color:#fff}
    .theme-dark .subtext-clr{color:rgba(255,255,255,.6);font-weight:500}
    .theme-dark .accent-txt{color:#83F9FF}
    .theme-light{background:#FFFFFF;color:#040811}
    .theme-light .aurora-canvas{background-color:#FFFFFF;background-image:radial-gradient(circle at 88% 8%,rgba(27,84,255,.08) 0%,transparent 50%),radial-gradient(circle at 12% 92%,rgba(131,249,255,.12) 0%,transparent 50%)}
    .theme-light .glass-pill{background:rgba(15,23,42,.04);border:1px solid rgba(15,23,42,.12);backdrop-filter:blur(14px);color:#0F172A;font-weight:600}
    .theme-light .glass-card{background:#fff;border:1px solid rgba(15,23,42,.08);box-shadow:0 4px 20px rgba(0,0,0,.04);backdrop-filter:blur(16px);color:#0F172A}
    .theme-light .modal-bg{background:#fff;border-color:rgba(15,23,42,.12);color:#0F172A}
    .theme-light .nav-container{background:rgba(255,255,255,.92);border:1px solid rgba(15,23,42,.1);backdrop-filter:blur(20px);color:#0F172A}
    .theme-light .input-bg{background:#F1F5F9;color:#0F172A;border:1px solid rgba(15,23,42,.08)}
    .theme-light .subtext-clr{color:#334155!important;font-weight:600!important}
    .theme-light .accent-txt{color:#1B54FF!important}
    .custom-file-wrapper{display:flex;justify-content:center;align-items:center;width:100%;text-align:center}.custom-file-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important}
    .day-tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:rgba(150,150,150,.45) transparent}.trip-swipe-card{transition:transform .34s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:pan-y}
    .khmer-greeting{font-family:'Kantumruy Pro','Siemreap',sans-serif;font-weight:600;letter-spacing:0}.app-section-title{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.04em;margin-bottom:6px}
    .app-section-subtitle{font-size:12px;line-height:1.5;margin-top:5px}
    .nav-container{gap:2px}
    .nav-container button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:42px}
    .nav-container button .nav-label{display:none}
    .theme-light .nav-container{color:#111827}
    .theme-dark .nav-container{color:#fff}
    .stay-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stay-summary{border-left:3px solid #1B54FF}
    .photo-source-link{font-size:10px;text-decoration:underline;text-underline-offset:3px}
    .day-tabs{scroll-snap-type:x proximity}.day-tabs button{scroll-snap-align:start}
    .theme-light .glass-pill{color:#111827}
    .theme-light .input-bg option{background:#fff;color:#111827}.trip-swipe-action{background:#dc2626;color:#fff}.home-heading{display:flex;flex-direction:column;gap:5px}.home-heading h1{line-height:1.2;max-width:270px}.home-heading .trip-location{margin-top:3px;font-size:13px;font-weight:600}.home-heading .trip-dates{margin-top:1px;font-size:11px}.leaflet-container{font-family:inherit}.leaflet-control-attribution{display:block!important;font-size:9px!important}.theme-dark .nav-container button{color:#fff!important}.theme-dark .nav-container button span{color:#fff!important}.theme-light .nav-container button{color:#040811!important}.theme-light .nav-container button.bg-\[#1B54FF\]{color:#fff!important}.theme-light .nav-container button span{color:#111827!important}
    /* Activity timeline connector: real dotted rail drawn with dots so it shows in light and dark */
    .activity-line{width:2px;flex:1 1 auto;min-height:12px;margin:5px 0;background-image:radial-gradient(circle, currentColor 1.1px, transparent 1.4px);background-size:2px 6px;background-repeat:repeat-y;opacity:.45}
    /* Booking pass details */
    .bp-route{display:flex;align-items:center;width:100%;color:#1B54FF}
    .bp-route i{width:5px;height:5px;border-radius:9999px;border:1px solid currentColor;display:block;flex:0 0 auto}
    .bp-route span{flex:1 1 auto;border-top:1.5px dotted currentColor;opacity:.9;margin:0 3px}
    .bp-dash{border-top:1px dashed currentColor;opacity:.2}
    .bp-dots{border-top:1.5px dotted currentColor;opacity:.9}
    .chk-seat{font-variant-numeric:tabular-nums}
    /* Trips completed card: dark gradient in Light mode, white card in Dark mode */
    .profile-trips-card{color:#fff;background-image:radial-gradient(120% 140% at 100% 0%,rgba(93,126,255,.28),transparent 60%),linear-gradient(135deg,#2a3550 0%,#141b2c 52%,#233049 100%);background-color:#141b2c;border:1px solid rgba(255,255,255,.10);box-shadow:0 16px 38px rgba(9,14,26,.35)}
    .ptc-label{color:rgba(255,255,255,.55)}.ptc-sub{color:rgba(255,255,255,.6)}.ptc-icon{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15)}
    .theme-dark .profile-trips-card{color:#0B1220;background-image:radial-gradient(120% 140% at 100% 0%,rgba(27,84,255,.10),transparent 62%),linear-gradient(135deg,#ffffff 0%,#F7F9FC 55%,#EDF1F7 100%);background-color:#fff;border:1px solid rgba(255,255,255,.85);box-shadow:0 18px 42px rgba(0,0,0,.45)}
    .theme-dark .ptc-label{color:rgba(11,18,32,.5)}.theme-dark .ptc-sub{color:rgba(11,18,32,.55)}.theme-dark .ptc-icon{background:rgba(11,18,32,.06);border:1px solid rgba(11,18,32,.10)}
    .profile-row{border-radius:14px;transition:background-color .18s ease}.profile-row:hover{background:rgba(15,23,42,.035)}.theme-dark .profile-row:hover{background:rgba(255,255,255,.05)}
    /* Welcome + sign-up */

   var root=document.getElementById('root');

     var where=(e && e.filename) ? e.filename.split('/').pop() : '';
     var line=(e && e.lineno) ? ' (line '+e.lineno+')' : '';
     root.innerHTML='<div style="max-width:360px;margin:30px auto;padding:20px;color:white;background:#172033;border:1px solid rgba(131,249,255,.3);border-radius:16px;font:14px sans-serif"><h2 style="font-size:18px;margin:0 0 10px">DerLog could not start</h2><p style="color:#cbd5e1">The browser reported this error:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:#83F9FF;font-size:12px">'+String(msg).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre><p style="color:#94a3b8;font-size:11px">'+where+line+'</p><p style="color:#cbd5e1">Check the internet connection and reload. If the error mentions a CDN, that library did not load.</p></div>';
   }
 });
 window.addEventListener('unhandledrejection',function(e){

   }
 });</script>

function cleanPlaceTitle(value){const s=String(value||'').replace(/_/g,' ').replace(/\s+/g,' ').trim();return s?s.split(' ').map(w=>/^[A-Z0-9]{2,}$/.test(w)?w:w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' '):'Place'}

function professionalText(value){
  let s=String(value||'').replace(/\s+/g,' ').trim();

function normalizeTrip(t){
  const trip={...t,
    items:Array.isArray(t.items)?t.items.map(i=>({...i,cost:Number(i.cost)||0})):[],
    currency:CURRENCIES.some(c=>c.code===t.currency)?t.currency:DEFAULT_CURRENCY,

    center:Array.isArray(t.center)&&t.center.length===2?t.center:[13.3622,103.8597],
    budget:Number(t.budget)||0,
    daysCount:Math.max(1,Number(t.daysCount)||1),
    nightsCount:Math.max(0,Number.isFinite(Number(t.nightsCount))?Number(t.nightsCount):Math.max(0,(Number(t.daysCount)||1)-1))};
  /* Older data stored a combined "City A & City B" name; a trip is one destination. */
  if(trip.title&&trip.title.includes('&')&&trip.location){
    const city=String(trip.location).split(',')[0].trim();
    const first=String(trip.title).split('&')[0].trim();
    if(city&&first&&city.toLowerCase()===first.toLowerCase())trip.title=city;

}
/* Older DerLog/RoamLog builds stored a demo trip with fixed 2026 dates. Keep the items, but move the

function reviveLegacyDemoTrip(trip){
  const demo=buildDemoTrip(),start=demo.startDate;
  const existing=Array.isArray(trip.items)?trip.items:[];
  const items=existing.length?existing.map(it=>{
    const n=Number(String(it.day||'').match(/\d+/)?.[0])||1;
    return it.date?{...it,date:addDaysISO(start,Math.min(demo.daysCount-1,n-1))}:it;
  }):demo.items.map(i=>({...i}));
  if(!items.some(i=>i.category==='Stay'||(i.booking&&i.booking.type==='stay')))items.push({...demo.items[3]});
  return {...trip,title:demo.title,location:demo.location,center:demo.center,startDate:demo.startDate,endDate:demo.endDate,daysCount:demo.daysCount,nightsCount:demo.nightsCount,items};
}
function loadDerLogData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_KEY);
    if(!raw)return makeInitialData();
    const saved=JSON.parse(raw);
    if(!saved||!Array.isArray(saved.trips)||!saved.trips.length)return makeInitialData();
    const trips=saved.trips.map(t=>normalizeTrip(t.id==='trip-tokyo'?reviveLegacyDemoTrip(t):t));
    return migrateData({...makeInitialData(),...saved,trips,
      activeTripId:trips.some(t=>t.id===saved.activeTripId)?saved.activeTripId:trips[0].id,
      theme:saved.theme==='light'?'light':'dark'});
  }catch(err){console.warn('DerLog recovered invalid saved data:',err);return makeInitialData()}
}
function loadBucketList(){
  try{
    const raw=localStorage.getItem(BUCKET_KEY)||localStorage.getItem('roamlog_bucket_v1');
    const list=JSON.parse(raw||'[]');
    return Array.isArray(list)?list:[];
  }catch{return []}
}

/* ---------------------------------------------------------------- booking OCR: read the ticket, then fetch what it missed */
function normalizeOcrText(raw){
  return String(raw||'').replace(/\r/g,'\n').replace(/[|•·]/g,' ').replace(/[ \t]+/g,' ')
    .split('\n').map(l=>l.trim()).filter(Boolean).join('\n');
}
function labelValue(lines,re){
  for(const line of lines){
    if(!re.test(line))continue;
    const cleaned=line.replace(re,'').replace(/^[\s:.\-–—#]+/,'').replace(/\b\d{1,2}:\d{2}\s*(?:am|pm)?\b.*$/i,'').trim();
    if(cleaned&&cleaned.length>=2&&cleaned.length<=48&&/[A-Za-z]/.test(cleaned))return cleaned;
  }
  return '';
}
/* Value printed right after a label, cut at the next label — confirmations often run labels together on one line. */
function valueAfterLabel(lines,re){
  const next=/(?:\bnumber of guests?\b|\bmeal plan\b|\bcheck[\s-]?in\b|\bcheck[\s-]?out\b|\bcancellation\b|\broom\b|\bprice\b|\btotal\b|\bphone\b|\baddress\b|\bemail\b|\bconfirmation\b|\bguests?\b)/i;
  for(const line of lines){
    const raw=String(line||'');
    const hit=raw.match(re);
    if(!hit||hit.index===undefined)continue;
    let rest=raw.slice(hit.index+hit[0].length).replace(/^[\s:.\-–—#]+/,'');
    const cut=rest.search(next);
    if(cut>0)rest=rest.slice(0,cut);
    rest=rest.replace(/[\s:;,\-–—]+$/,'').replace(/\s+/g,' ').trim();
    if(rest.length>=2&&rest.length<=48)return rest;
  }
  return '';
}
function extractOcrTimes(text){
  const out=[],re=/\b([01]?\d|2[0-3])\s*:\s*([0-5]\d)\s*(am|pm)?\b/gi;let m;
  while((m=re.exec(text))){
    let h=Number(m[1]);const ap=String(m[3]||'').toLowerCase();
    if(ap==='pm'&&h<12)h+=12;
    if(ap==='am'&&h===12)h=0;
    const v=`${String(h).padStart(2,'0')}:${m[2]}`;
    if(!out.includes(v))out.push(v);
  }
  return out;
}
function extractOcrDates(text,trip){
  const fallbackYear=Number(String(trip&&trip.startDate||isoToday()).slice(0,4))||new Date().getFullYear();
  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const found=[];
  const isoFor=(y,m,d)=>{const mi=Number(m),day=Number(d);if(!(mi>=1&&mi<=12)||!(day>=1&&day<=31))return'';return `${String(y).padStart(4,'0')}-${String(mi).padStart(2,'0')}-${String(day).padStart(2,'0')}`};
  const push=v=>{if(v&&!found.includes(v))found.push(v)};
  let m;
  const iso=/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/g;while((m=iso.exec(text)))push(isoFor(m[1],m[2],m[3]));
  const dmy=/\b(\d{1,2})\s*[/.-]\s*(\d{1,2})\s*[/.-]\s*(20\d{2})\b/g;while((m=dmy.exec(text)))push(isoFor(m[3],m[2],m[1]));
  const dm=/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s*(20\d{2})?\b/gi;
  while((m=dm.exec(text)))push(isoFor(m[3]||fallbackYear,months[String(m[2]).toLowerCase().slice(0,3)],m[1]));
  const md=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(20\d{2})?\b/gi;
  while((m=md.exec(text)))push(isoFor(m[3]||fallbackYear,months[String(m[1]).toLowerCase().slice(0,3)],m[2]));
  return found;
}
function extractOcrMoney(text,fallbackCode){
  const source=String(text||'');

  const hintName=String(fileHint||'');
  const hintCode=/confirm|booking|reservation|ticket|reference|pnr|voucher/i.test(hintName)?((hintName.match(/(\d{5,})/)||[])[1]||''):'';

    const checkInRaw=labelValue(lines,/check[\s.-]?in/i);

      property:guessProperty(lines),
      checkIn,checkOut,roomType,
      guestName,guests,contact:phone||email,
      total:money.value?String(money.value):'',totalCurrency:money.value?money.currency:'',

  }

  const operatorName=guessOperator(lines);
  /* City names on the ticket are not passengers; drop any name that is really a place or the operator. */
  const placeNames=placeCandidates(normalized).map(p=>p.toLowerCase());
  let passengers=(words&&words.length?extractOcrPassengersFromWords(words):extractOcrPassengers(lines))
    .filter(p=>!placeNames.includes(p.name.toLowerCase())&&p.name.toLowerCase()!==String(operatorName||'').trim().toLowerCase());

  if(seatCount>0&&passengers.length>seatCount){

      .sort((a,b)=>((a.p.seat?0:1)-(b.p.seat?0:1))||(a.i-b.i))
      .slice(0,seatCount).sort((a,b)=>a.i-b.i).map(x=>x.p);
  }
  /* The seat can print beside a name the row reader flattened away; fill gaps from a labelled seat field. */
  if(passengers.length){
    const usedSeats=new Set(passengers.map(p=>p.seat).filter(Boolean));
    const fallbackSeats=[...normalized.matchAll(/\bseat\s*(?:no\.?|number|#)?\s*[:#-]?\s*([0-9]{1,3}\s?[A-Z]?)\b/gi)]
      .map(m=>m[1].replace(/\s+/g,'').toUpperCase()).filter(seat=>seat&&!usedSeats.has(seat));

    vehicleType:extractVehicleType(normalized),

    destination:route.destination||labelValue(lines,/(?:^|\s)(?:to|destination|arrival|arriving)\b/i),

    departureTime:times[0]||'',
    arrivalTime:times[1]||'',
    durationMinutes:duration,
    passengers,
    total:money.value?String(money.value):'',totalCurrency:money.value?money.currency:'',
    ticketNumber:code||hintCode
  }};
}
/* Fills what the image did not contain: derived times, and city names resolved through a place lookup. */
async function enrichBooking(booking,text,trip,type){
  const out={...booking};
  const filled=[];
  if(type==='transport'){
    if(out.departureTime&&out.arrivalTime&&!out.durationMinutes){
      const d=minutesBetween(out.departureTime,out.arrivalTime);
      if(d>0){out.durationMinutes=d;filled.push('duration')}
    }
    if(out.departureTime&&out.durationMinutes){
      const printed=out.arrivalTime?minutesBetween(out.departureTime,out.arrivalTime):null;
      /* One misread digit in the arrival is common; the printed travel time wins when the two disagree. */
      if(printed===null||Math.abs(printed-Number(out.durationMinutes))>10){
        out.arrivalTime=shiftTime(out.departureTime,out.durationMinutes);filled.push('arrival time');
      }
    }
    if(!out.travelDate&&trip&&trip.startDate){out.travelDate=trip.startDate}
    if(!out.origin||!out.destination){
      const candidates=placeCandidates(text)
        .filter(name=>name.toLowerCase()!==String(out.origin||'').toLowerCase()&&name.toLowerCase()!==String(out.destination||'').toLowerCase())
        .slice(0,4);
      if(candidates.length){
        const hits=(await Promise.all(candidates.map(lookupPlace))).filter(Boolean);
        const pool=hits.slice();
        if(!out.origin&&pool.length){out.origin=pool[0].name;pool.shift();filled.push('origin')}
        if(!out.destination&&pool.length){out.destination=pool[0].name;filled.push('destination')}
      }
    }
  }else{
    if(out.checkIn&&!out.checkOut&&Number(out.nights)>0){out.checkOut=addDaysISO(out.checkIn,Number(out.nights));filled.push('check-out')}
    if(out.checkIn&&out.checkOut&&!Number(out.nights)){
      const n=Math.max(0,daysBetween(out.checkIn,out.checkOut));
      if(n>0){out.nights=n;filled.push('nights')}
    }
    if(out.property&&(!out.roomType||!out.total)){
      const hit=await lookupPlace(out.property);
      if(hit&&hit.city&&!out.roomType){/* place confirmed; nothing to overwrite */}
    }
  }
  return {booking:out,filled};
}

/* ---------------------------------------------------------------- booking creator */
function BookingCreator({trip,initial,onSave,onClose}){
  const source=initial&&initial.item?initial.item:null;

  const [status,setStatus]=useState('');
  const [filled,setFilled]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [busy,setBusy]=useState(false);
  const [t,setT]=useState(()=>({
    operator:sourceBooking.operator||'',
    vehicleType:sourceBooking.vehicleType||'',
    origin:sourceBooking.origin||'',
    destination:sourceBooking.destination||'',
    travelDate:sourceBooking.travelDate||(source&&source.date)||trip.startDate||isoToday(),
    departureTime:sourceBooking.departureTime||(/^\d/.test(String(source&&source.time||''))?source.time:''),
    arrivalTime:sourceBooking.arrivalTime||'',
    durationMinutes:Number(sourceBooking.durationMinutes)||0,
    total:sourceBooking.total!=null?String(sourceBooking.total):(source&&source.cost?String(source.cost):''),
    ticketNumber:sourceBooking.ticketNumber||'',
    passengers:(Array.isArray(sourceBooking.passengers)&&sourceBooking.passengers.length)?sourceBooking.passengers.map(p=>({name:p.name||'',seat:p.seat||''})):[{name:'',seat:''}]
  }));
  const [s,setS]=useState(()=>({
    property:sourceBooking.property||(source&&source.title)||'',
    roomType:sourceBooking.roomType||'',
    checkIn:sourceBooking.checkIn||(source&&source.checkIn)||trip.startDate||isoToday(),
    checkOut:sourceBooking.checkOut||(source&&source.checkOut)||addDaysISO(trip.startDate||isoToday(),1),
    total:sourceBooking.total!=null?String(sourceBooking.total):(source&&source.cost?String(source.cost):''),
    confirmationNumber:sourceBooking.confirmationNumber||'',
    guestName:sourceBooking.guestName||'',
    guests:sourceBooking.guests?String(sourceBooking.guests):'',
    contact:sourceBooking.contact||''

  const nights=Math.max(0,daysBetween(s.checkIn,s.checkOut));
  const duration=Number(t.durationMinutes)||((t.departureTime&&t.arrivalTime)?minutesBetween(t.departureTime,t.arrivalTime):0);
  const setPassenger=(idx,patch)=>setT(prev=>({...prev,passengers:prev.passengers.map((p,i)=>i===idx?{...p,...patch}:p)}));
  const addPassenger=()=>setT(prev=>({...prev,passengers:[...prev.passengers,{name:'',seat:''}]}));
  const removePassenger=idx=>setT(prev=>({...prev,passengers:prev.passengers.length>1?prev.passengers.filter((_,i)=>i!==idx):prev.passengers}));
  const mergeInto=(prev,add)=>{const out={...prev};Object.entries(add||{}).forEach(([k,v])=>{const empty=v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);if(!empty)out[k]=v});return out};

      if(!Number.isFinite(lat)||!Number.isFinite(lng)){lat=13.3622;lng=103.8597}
      const query=mode==='stay'?booking.property:[booking.origin,booking.destination].filter(Boolean).join(' ');
      if(query){
        const hit=await lookupPlace(query);
        if(hit&&Number.isFinite(hit.lat)&&Number.isFinite(hit.lng)){lat=hit.lat;lng=hit.lng}
      }

        id:(source&&source.id)||`bk-${Date.now()}`,

        lat,lng,
        attachment,
        booking,
        ...(mode==='stay'?{checkIn:booking.checkIn,checkOut:booking.checkOut,nights:booking.nights}:{})
      };
      onSave(item);
    }finally{setBusy(false)}
  };

/* ---------------------------------------------------------------- destination recommendations: rating + popularity */
async function fetchWikiInsights(titles){
  const map=new Map();
  const list=(titles||[]).filter(Boolean);
  for(let i=0;i<list.length;i+=16){
    const batch=list.slice(i,i+16);
    const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1'
      +'&prop=extracts|pageimages|pageviews|langlinks|info'
      +'&exintro=1&explaintext=1&exchars=600&piprop=thumbnail&pithumbsize=640'
      +'&lllimit=500&pvipdays=30&inprop=url'
      +'&titles='+encodeURIComponent(batch.join('|'));
    try{
      const res=await fetch(url);
      if(!res.ok)continue;
      const json=await res.json();
      const pages=Object.values((json.query&&json.query.pages)||{});
      pages.forEach(page=>{
        if(!page||!page.title)return;
        if(page.missing!==undefined)return;
        const views=Object.values(page.pageviews||{}).reduce((sum,v)=>sum+(Number(v)||0),0);
        map.set(String(page.title).toLowerCase(),{
          extract:page.extract||'',
          thumb:(page.thumbnail&&page.thumbnail.source)||'',
          views,
          langs:Array.isArray(page.langlinks)?page.langlinks.length:0,
          url:page.fullurl||''
        });
      });
      ((json.query&&json.query.redirects)||[]).forEach(r=>{const target=map.get(String(r.to||'').toLowerCase());if(target)map.set(String(r.from||'').toLowerCase(),target)});
      ((json.query&&json.query.normalized)||[]).forEach(n=>{const target=map.get(String(n.to||'').toLowerCase());if(target)map.set(String(n.from||'').toLowerCase(),target)});
    }catch(err){/* one batch failing should not hide the rest */}
  }
  return map;
}
/* A 4.0 – 9.8 interest score: how widely a place is written about and how many people look it up. */
function interestScore(place,info,maxViews){
  const views=Number(info&&info.views)||0;
  const langs=Number(info&&info.langs)||0;
  const popularity=maxViews>1?Math.min(1,Math.pow(views/maxViews,0.65)):0;
  const coverage=Math.min(1,langs/45);
  const authority=(place.wikiTitle?0.34:0)+(place.wikidata?0.16:0)+(place.hasImage?0.1:0)+(place.website?0.05:0)+(place.hasDescription?0.08:0);
  const kindBonus={Attraction:0.12,Museum:0.08,Viewpoint:0.06,'Theme Park':0.07,Zoo:0.05,Monument:0.08,Temple:0.08,Park:0.04,'Archaeological Site':0.09}[place.kind]||0;
  const raw=popularity*0.45+coverage*0.2+authority*0.22+kindBonus;
  return Math.round(Math.min(9.8,4.2+raw*5.4)*10)/10;
}
function destinationFallback(place,location){
  const kind=String(place.kind||'Place');
  const where=location?` in ${location}`:' nearby';
  const lines={Attraction:'A landmark travelers make a point of seeing',Museum:'A museum worth an unhurried visit',Viewpoint:'A viewpoint with a wide open view',Zoo:'A wildlife park for a slow afternoon','Theme Park':'A theme park for a fun half day',Park:'A green space to slow down',Temple:'A temple with a long history',Monument:'A monument that marks the city story','Archaeological Site':'An archaeological site with centuries of history'};
  return `${lines[kind]||'A well-loved stop'}${where}.`;
}
function popularityLabel(views){
  const v=Number(views)||0;
  if(v>=1000)return `${formatCompact(v)} views / month`;
  if(v>0)return `${v} views / month`;
  return 'Local favourite';
}
function fetchWithTimeout(url,options,ms){
  const controller=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=controller?setTimeout(()=>controller.abort(),ms):null;
  return fetch(url,{...(options||{}),...(controller?{signal:controller.signal}:{})}).finally(()=>{if(timer)clearTimeout(timer)});
}
/* Real photographs only: Openverse (independent photographers) first, Wikimedia Commons as a backup.
   Maps, paintings, diagrams and AI-generated files are filtered out. */
function photoIsPhotograph(title,description){
  const name=String(title||'');
  const hay=name+' '+String(description||'');
  if(!name&&!hay.trim())return false;
  if(/\.(svg|gif|png|tif|tiff)$/i.test(name))return false;
  return !/(\bmap\b|\bmaps\b|diagram|logo|coat of arms|painting|drawing|sketch|illustration|poster|stamp|screenshot|\bchart\b|\bgraph\b|floor plan|ai[- ]?generated|generated by|midjourney|stable diffusion|dall[- ]?e|3d render)/i.test(hay);
}
async function fetchPhotographs(query,limit){
  const out=[],seen=new Set();
  const push=(src,title,desc)=>{if(!src||out.length>=limit)return;if(!photoIsPhotograph(title,desc))return;const key=String(title||src).toLowerCase();if(seen.has(key))return;seen.add(key);out.push(src)};
  try{
    const res=await fetchWithTimeout(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(query)}&page_size=24&mature=false`,{},9000);
    if(res.ok){
      const json=await res.json();
      (json.results||[]).forEach(r=>push(r.url||r.thumbnail,r.title,r.description||(r.tags&&r.tags.map(t=>t.name).join(' '))));
    }
  }catch(err){}
  for(const term of [query,`${query} photograph`]){
    if(out.length>=limit)break;
    try{
      const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(term)}&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1200&format=json&origin=*`;
      const res=await fetchWithTimeout(url,{},9000);
      if(!res.ok)continue;
      const json=await res.json();
      Object.values((json.query&&json.query.pages)||{}).forEach(page=>{
        const info=(page.imageinfo&&page.imageinfo[0])||{},meta=info.extmetadata||{};
        push(info.thumburl,page.title||'',String((meta.ImageDescription&&meta.ImageDescription.value)||'').replace(/<[^>]*>/g,' '));
      });
    }catch(err){}
  }
  return out.slice(0,limit);
}
/* OpenStreetMap tags carry enough signal to rank a place without a second data source. */
function osmInterestScore(place){
  const kind=String(place&&place.kind||'').toLowerCase();
  let score=5;
  if(/museum|attraction|viewpoint|zoo|theme park/.test(kind))score+=1.5;
  if(/archaeological|monument|memorial|castle|ruins|temple|shrine|fort/.test(kind))score+=2.1;
  if(/park|garden|nature reserve|beach/.test(kind))score+=1.1;
  if(place&&place.wikidata)score+=0.8;
  if(place&&place.wikiTitle)score+=0.5;
  if(place&&place.website)score+=0.3;
  if(place&&place.imageUrl)score+=0.3;
  return Math.round(Math.min(10,score)*10)/10;
}
/* Nearby sights from OpenStreetMap. Several public mirrors exist, so try each of them before giving up. */
async function fetchOverpassPlaces(lat,lng,radius){
  const query=`[out:json][timeout:25];(node(around:${radius},${lat},${lng})[name][tourism~"attraction|museum|viewpoint|zoo|theme_park"];way(around:${radius},${lat},${lng})[name][tourism~"attraction|museum|viewpoint|zoo|theme_park"];relation(around:${radius},${lat},${lng})[name][tourism~"attraction|museum|viewpoint|zoo|theme_park"];node(around:${radius},${lat},${lng})[name][historic];way(around:${radius},${lat},${lng})[name][historic];node(around:${radius},${lat},${lng})[name][leisure=park];way(around:${radius},${lat},${lng})[name][leisure=park];);out center tags 60;`;
  const mirrors=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.osm.ch/api/interpreter'];
  /* Ask every mirror at once and take the first usable answer, so one slow mirror cannot stall the tab. */
  const attempts=mirrors.map(mirror=>fetchWithTimeout(mirror,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(query)},9000)
    .then(res=>res.ok?res.json():null)
    .then(json=>json&&Array.isArray(json.elements)&&json.elements.length?json.elements:null)
    .catch(()=>null));
  const results=await Promise.all(attempts);
  return results.find(Boolean)||null;
}
/* Fallback source: the most written-about places near the trip, straight from Wikipedia's geo index. */
async function fetchWikipediaGeoPlaces(lat,lng){
  const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1'
    +'&generator=geosearch&ggscoord='+lat+'%7C'+lng+'&ggsradius=10000&ggslimit=50&ggsnamespace=0'
    +'&prop=coordinates|extracts|pageimages|pageviews|langlinks|info'
    +'&exintro=1&explaintext=1&exchars=600&piprop=thumbnail&pithumbsize=640'
    +'&lllimit=500&pvipdays=30&inprop=url';
  const res=await fetchWithTimeout(url,{},15000);
  if(!res.ok)return null;
  const json=await res.json();
  const pages=Object.values((json.query&&json.query.pages)||{});
  return pages.filter(p=>p&&p.title&&p.missing===undefined).map(page=>{
    const coords=(page.coordinates&&page.coordinates[0])||{};
    const views=Object.values(page.pageviews||{}).reduce((sum,v)=>sum+(Number(v)||0),0);
    const insight={extract:page.extract||'',thumb:(page.thumbnail&&page.thumbnail.source)||'',views,langs:Array.isArray(page.langlinks)?page.langlinks.length:0,url:page.fullurl||''};
    return {
      place:{
        id:`wiki-${page.pageid}`,title:cleanPlaceTitle(page.title),kind:'Attraction',
        description:page.extract||'',address:'',lat:Number(coords.lat),lng:Number(coords.lon),
        wikiTitle:String(page.title),wikidata:'',website:'',
        imageUrl:insight.thumb,hasImage:Boolean(insight.thumb),hasDescription:Boolean(page.extract)
      },
      insight
    };
  }).filter(item=>item.place.title&&Number.isFinite(item.place.lat)&&Number.isFinite(item.place.lng)
    &&!/^(list of|timeline)/i.test(item.place.title)
    &&!/(hotel|hostel|resort|guesthouse|airport|railway station|bus station|university|school|hospital|bank|embassy|municipality|province|district|commune|highway)/i.test(item.place.title));
}

/* ---------------------------------------------------------------- welcome / sign-up */
function loadGoogleSignIn(){
  return new Promise((resolve,reject)=>{
    if(window.google&&window.google.accounts&&window.google.accounts.id)return resolve();
    const done=()=>window.google&&window.google.accounts&&window.google.accounts.id?resolve():reject(new Error('Google sign-in did not load'));
    const existing=document.getElementById('gsi-client');
    if(existing){existing.addEventListener('load',done);existing.addEventListener('error',()=>reject(new Error('Google sign-in did not load')));return}
    const s=document.createElement('script');s.id='gsi-client';s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;
    s.onload=done;s.onerror=()=>reject(new Error('Google sign-in did not load'));document.head.appendChild(s);
  });
}
function decodeGoogleCredential(token){
  try{
    const part=String(token||'').split('.')[1];
    if(!part)return null;
    const b64=part.replace(/-/g,'+').replace(/_/g,'/');
    const json=decodeURIComponent(atob(b64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(err){return null}
}

/* ---------------------------------------------------------------- cloud account (Google Drive app folder) */
const CLOUD_FILE_NAME='derlog-cloud.json';
const CLOUD_SCOPE='https://www.googleapis.com/auth/drive.appdata';
const CLOUD_SESSION_KEY='derlog_cloud_session_v1';

function loadCloudSession(){
 try{
   const raw=sessionStorage.getItem(CLOUD_SESSION_KEY);
   if(!raw)return null;
   const parsed=JSON.parse(raw);
   return parsed&&parsed.token?parsed:null;
 }catch(err){return null}
}
function saveCloudSession(session){
 try{sessionStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(session))}catch(err){}
 return session;
}
function clearCloudSession(){try{sessionStorage.removeItem(CLOUD_SESSION_KEY)}catch(err){}}
function cloudSessionLive(session){return Boolean(session&&session.token&&Number(session.expiresAt||0)>Date.now()+30000)}

async function fetchGoogleProfile(token){
 const res=await fetch('https://openidconnect.googleapis.com/v1/userinfo',{headers:{Authorization:'Bearer '+token}});
 if(!res.ok)throw new Error('Google did not return your profile.');
 return res.json();
}

/* One Google popup gives us the account and permission to keep a snapshot in the
   account's own hidden Drive app-data folder. No DerLog server is involved. */
function requestGoogleAccess(clientId){
 return new Promise((resolve,reject)=>{
  loadGoogleSignIn().then(()=>{
   const oauth=window.google&&window.google.accounts&&window.google.accounts.oauth2;
   if(!oauth)return reject(new Error('Google sign-in is unavailable in this browser.'));
   let settled=false;
   const fail=text=>{if(!settled){settled=true;reject(new Error(text))}};
   try{
    const client=oauth.initTokenClient({
      client_id:clientId,
      scope:'openid email profile '+CLOUD_SCOPE,
      callback:async response=>{
        if(!response||response.error)return fail(response&&response.error==='access_denied'?'Sign-in was cancelled.':'Google sign-in failed. Please try again.');
        if(!response.access_token)return fail('Google did not return access.');
        try{
          const profile=await fetchGoogleProfile(response.access_token);
          if(settled)return;
          settled=true;
          resolve({token:response.access_token,expiresAt:Date.now()+(Number(response.expires_in)||3300)*1000,profile:profile||{}});
        }catch(err){fail(err&&err.message?err.message:'Google did not return your profile.')}
      },
      error_callback:event=>{
        const type=event&&event.type;
        fail(type==='popup_closed'?'Sign-in window was closed.':'Could not open Google sign-in. Check that this page is an allowed origin for the Client ID.');
      }
    });
    client.requestAccessToken({prompt:'select_account'});
   }catch(err){fail('Google sign-in could not start. Check the Client ID in Settings.')}
  }).catch(err=>reject(err));
 });
}

async function driveJson(url,options){
 const res=await fetch(url,options);
 if(res.status===401)throw new Error('Google access expired. Reconnect your account.');
 if(!res.ok){
   let detail='';
   try{const body=await res.json();detail=(body&&body.error&&(body.error.message||body.error.status))||''}catch(err){}
   throw new Error(detail||('Google Drive request failed ('+res.status+').'));
 }
 return res.json();
}

async function cloudPull(token){
 const q=encodeURIComponent("name = '"+CLOUD_FILE_NAME+"' and trashed = false");
 const listing=await driveJson('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q='+q,{headers:{Authorization:'Bearer '+token}});
 const file=(listing.files||[])[0];
 if(!file)return null;
 const res=await fetch('https://www.googleapis.com/drive/v3/files/'+file.id+'?alt=media',{headers:{Authorization:'Bearer '+token}});
 if(!res.ok)throw new Error('DerLog could not download your cloud data.');
 const payload=await res.json();
 return {fileId:file.id,modifiedTime:file.modifiedTime,payload};
}

async function cloudPush(token,fileId,snapshot){
 const boundary='derlog'+Date.now().toString(36);
 const metadata={name:CLOUD_FILE_NAME,mimeType:'application/json'};
 if(!fileId)metadata.parents=['appDataFolder'];
 const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(snapshot)+'\r\n--'+boundary+'--';
 const url=fileId
  ?'https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=multipart&fields=id,modifiedTime'
  :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime';
 const res=await fetch(url,{method:fileId?'PATCH':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body});
 if(res.status===401)throw new Error('Google access expired. Reconnect your account.');
 if(!res.ok){
   let detail='';
   try{const parsed=await res.json();detail=(parsed&&parsed.error&&(parsed.error.message||parsed.error.status))||''}catch(err){}
   throw new Error(detail||('DerLog could not save to Google Drive ('+res.status+').'));
 }
 return res.json();
}

function cloudSnapshot(data,bucketList){
 return {app:'DerLog',kind:'derlog-cloud',schemaVersion:SCHEMA_VERSION,updatedAt:new Date().toISOString(),data,bucketList};
}

/* Offline-first: local storage is always written first, the cloud copy is pushed
   whenever the device is online. A failed push simply leaves the local copy as the
   newest state and the next save or reconnect retries it. */
async function cloudSyncNow(data,bucketList,session){
 if(!cloudSessionLive(session))return {ok:false,reason:'reconnect'};
 if(typeof navigator!=='undefined'&&navigator.onLine===false)return {ok:false,reason:'offline'};
 try{
   const full=await restoreMediaDeep(data);
   const fullBucket=await restoreMediaDeep(Array.isArray(bucketList)?bucketList:[]);
   const saved=await cloudPush(session.token,session.fileId||'',cloudSnapshot(full,fullBucket));
   if(saved&&saved.id)saveCloudSession({...session,fileId:saved.id});
   return {ok:true,fileId:(saved&&saved.id)||session.fileId||'',at:new Date().toISOString()};
 }catch(err){
   return {ok:false,reason:'error',error:err&&err.message?err.message:'Cloud sync failed.'};
 }
}

/* Look only inside this app's own storage — never the rest of the phone. */
async function findLocalProfile(){
 try{
   const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_KEY);
   if(!raw)return null;
   const saved=JSON.parse(raw);
   if(!saved||!saved.hasProfileHistory||!Array.isArray(saved.trips)||!saved.trips.length)return null;
   const restored=await restoreMediaDeep(migrateData(saved));
   return {data:restored,bucketList:await restoreMediaDeep(loadBucketList())};
 }catch(err){return null}
}

const CURRENCIES=[

 {code:'GBP',symbol:'£',label:'British Pound'},

/* Scanned tickets may be priced in another currency. Rates are cached here for 12 hours;
   the fixed table is only a fallback when the device is offline and nothing is cached yet. */
const FX_CACHE_KEY='derlog_fx_v1';
const FX_ENDPOINT='https://open.er-api.com/v6/latest/USD';
const FX_FALLBACK={USD:1,KHR:4050,EUR:0.92,GBP:0.79,JPY:150,VND:25400,SGD:1.34,AUD:1.52};
let fxRatesMemory=null;
function readFxCache(){
  if(fxRatesMemory)return fxRatesMemory;
  try{
    const raw=localStorage.getItem(FX_CACHE_KEY);
    const saved=raw?JSON.parse(raw):null;
    if(saved&&saved.rates)fxRatesMemory=saved;
  }catch(err){}
  return fxRatesMemory;
}
async function getFxRates(){
  const cached=readFxCache();
  if(cached&&Date.now()-Number(cached.at||0)<12*3600*1000)return cached.rates;
  try{
    const res=await fetch(FX_ENDPOINT,{cache:'no-store'});
    if(res.ok){
      const json=await res.json();
      const rates=json&&json.rates;
      if(rates&&Number(rates.USD)&&Number(rates.KHR)){
        fxRatesMemory={rates,at:Date.now()};
        try{localStorage.setItem(FX_CACHE_KEY,JSON.stringify(fxRatesMemory))}catch(err){}
        return rates;
      }
    }
  }catch(err){}
  return (cached&&cached.rates)||FX_FALLBACK;
}
function convertMoney(amount,from,to,rates){
  const value=Number(amount)||0,source=String(from||'').toUpperCase(),target=String(to||'').toUpperCase();
  if(!value||!source||!target||source===target)return value;
  const table=rates||FX_FALLBACK;
  const fromRate=Number(table[source]),toRate=Number(table[target]);
  if(!fromRate||!toRate)return value;
  return value/fromRate*toRate;
}
function currencyOf(trip){return CURRENCIES.find(c=>trip&&c.code===trip.currency)||CURRENCIES[0]}

 return `${c.symbol}${shown}`;
}
function initialsFor(name,email){

/* ---------------------------------------------------------------- media (IndexedDB) + persistence */
const MEDIA_DB='derlog_media';
function isMediaPayload(v){return typeof v==='string'&&v.length>4096&&/^data:[^,]+;base64,/i.test(v)}
function mediaKeyFor(v){let h=5381;for(let i=0;i<v.length;i+=53){h=((h<<5)+h+v.charCodeAt(i))|0}return 'm'+(h>>>0).toString(36)+'-'+v.length.toString(36)}
function openMediaDb(){
 const request=version=>new Promise((resolve,reject)=>{
   let req;
   try{req=version?indexedDB.open(MEDIA_DB,version):indexedDB.open(MEDIA_DB)}catch(err){return reject(err)}
   req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files')};
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error||new Error('Could not open media storage'));
   req.onblocked=()=>reject(new Error('Media storage is open in another tab'));
 });
 return (async()=>{
   if(!window.indexedDB)throw new Error('IndexedDB unavailable');
   let db=await request();
   if(db.objectStoreNames.contains('files'))return db;
   /* Heal a database left at version 1 without its object store. */
   const nextVersion=db.version+1;
   db.close();
   db=await request(nextVersion);
   if(!db.objectStoreNames.contains('files')){db.close();throw new Error('Media store unavailable')}
   return db;
 })();
}
async function mediaPut(key,value){
 const db=await openMediaDb();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction('files','readwrite');
   tx.objectStore('files').put(value,key);
   tx.oncomplete=()=>{db.close();resolve(true)};
   tx.onerror=()=>{db.close();reject(tx.error)};
   tx.onabort=()=>{db.close();reject(tx.error||new Error('Media write aborted'))};
 });
}
async function mediaGet(key){
 const db=await openMediaDb();
 return new Promise(resolve=>{
   const tx=db.transaction('files','readonly');
   const req=tx.objectStore('files').get(key);
   req.onsuccess=()=>{db.close();resolve(req.result)};
   req.onerror=()=>{db.close();resolve(undefined)};
 });
}
async function stripMediaDeep(value,collect){
 if(typeof value==='string'){
   if(isMediaPayload(value)){const key=mediaKeyFor(value);collect.push([key,value]);return 'idb://'+key}
   return value;
 }
 if(Array.isArray(value)){const out=[];for(const entry of value)out.push(await stripMediaDeep(entry,collect));return out}
 if(value&&typeof value==='object'){const out={};for(const key of Object.keys(value))out[key]=await stripMediaDeep(value[key],collect);return out}
 return value;
}
async function restoreMediaDeep(value){
 if(typeof value==='string'){
   if(value.startsWith('idb://')){try{const stored=await mediaGet(value.slice(6));return typeof stored==='string'?stored:''}catch(err){return ''}}
   return value;
 }
 if(Array.isArray(value)){const out=[];for(const entry of value)out.push(await restoreMediaDeep(entry));return out}
 if(value&&typeof value==='object'){const out={};for(const key of Object.keys(value))out[key]=await restoreMediaDeep(value[key]);return out}
 return value;
}
async function persistDerLog(data,bucketList){
 const collect=[];
 let stripped,strippedBucket;
 try{stripped=await stripMediaDeep(data,collect);strippedBucket=await stripMediaDeep(bucketList,[])}catch(err){stripped=data;strippedBucket=bucketList}
 const failed=new Map();
 await Promise.all(collect.map(async([key,value])=>{try{const ok=await mediaPut(key,value);if(ok===false)failed.set(key,value)}catch(err){failed.set(key,value)}}));
 if(failed.size){
   const revert=async value=>{
     if(typeof value==='string'&&value.startsWith('idb://')&&failed.has(value.slice(6)))return failed.get(value.slice(6));
     if(Array.isArray(value)){const out=[];for(const entry of value)out.push(await revert(entry));return out}
     if(value&&typeof value==='object'){const out={};for(const key of Object.keys(value))out[key]=await revert(value[key]);return out}
     return value;
   };
   stripped=await revert(stripped);strippedBucket=await revert(strippedBucket);
 }
 try{
   const text=JSON.stringify(stripped);
   localStorage.setItem(STORAGE_KEY,text);
   localStorage.setItem(BUCKET_KEY,JSON.stringify(strippedBucket));
   return {ok:true,bytes:text.length,mediaMoved:collect.length-failed.size};
 }catch(err){
   const quota=err&&(err.name==='QuotaExceededError'||/quota/i.test(String(err.message||'')));
   return {ok:false,error:quota?'This device is out of browser storage. Export a backup, then remove a large photo or PDF.':'DerLog could not save to this device. Export a backup to keep your data safe.'};
 }
}

}

class DerLogErrorBoundary extends React.Component {
 constructor(props){super(props);this.state={error:null};}
 static getDerivedStateFromError(error){return {error};}
 componentDidCatch(error,info){console.error('DerLog render error:',error,info);}
 render(){
   if(this.state.error){
     return <div style={{maxWidth:360,margin:'30px auto',padding:20,color:'#fff',background:'#172033',border:'1px solid rgba(131,249,255,.3)',borderRadius:16,font:'14px sans-serif'}}>
       <h2 style={{fontSize:18,margin:'0 0 10px'}}>DerLog could not render</h2>
       <pre style={{whiteSpace:'pre-wrap',overflowWrap:'anywhere',color:'#83F9FF',fontSize:12}}>{this.state.error.message || String(this.state.error)}</pre>
       <p style={{color:'#cbd5e1',fontSize:12}}>Please send this exact error message so the failing feature can be repaired.</p>
     </div>;
   }
   return this.props.children;
 }
}
try{
 if(!window.React||!window.ReactDOM)throw new Error('React did not load. Check your internet connection and reload.');
 const rootNode=document.getElementById('root');
 const mount=boot=>{
   window.__DERLOG_BOOT__=boot;
   const root=ReactDOM.createRoot(rootNode);
   root.render(<div id="derlog-app"><DerLogErrorBoundary><App/></DerLogErrorBoundary></div>);
   if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline copy unavailable:',err));
 };
 bootDerLog().then(mount).catch(err=>{console.warn('DerLog boot fallback:',err);mount({data:migrateData(loadDerLogData()),bucketList:loadBucketList()})});
}catch(error){
 console.error(error);
 document.getElementById('root').innerHTML='<div style="max-width:360px;margin:30px auto;padding:20px;color:white;background:#172033;border-radius:16px;font:14px sans-serif"><h2>DerLog could not start</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:#83F9FF;font-size:12px">'+String(error&&error.message||error).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+'</pre></div>'
}
</script>
