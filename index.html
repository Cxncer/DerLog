<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My App Login</title>
  <script src="https://google.com" async></script>
</head>
<body>

  <h2>Sign in to my app</h2>

  <div id="g_id_onload"
       data-client_id="110946969761-a1lbb3uv4n4qqf2258j5ne4uinli6i53.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin" data-type="standard"></div>

  <p id="user-info"></p>

  <script>
    function handleCredentialResponse(response) {
      // Decode the user info from Google's response
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      
      // Show the user's name and email on the page
      document.getElementById("user-info").innerText = 
        "Welcome, " + payload.name + " (" + payload.email + ")!";
    }
  </script>

</body>
</html>
